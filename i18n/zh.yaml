profile_exp_title: "历往经历"
profile_exp_ai_delivery_title: "xxxx | AI 应用交付工程师"
profile_exp_ai_delivery_desc: "负责 AI 应用在私有化环境中的部署和技术支持。根据物理机、虚拟机、公有云等不同环境设计部署方案并完成交付。负责 AI 智能体产品部署，包括服务组件、模型服务、依赖环境配置。部署 Qwen、LLaMA 等开源模型服务，使用 vLLM/TGI 进行推理环境优化。根据业务需求调整模型推理参数，包括批处理策略、缓存配置、并行部署等。部署 Embedding、OCR 等 AI 基础服务，协助完成应用集成。处理 GPU 资源配置、模型加载异常、服务调用超时等问题。"
profile_exp_sre_title: "xxxx | 云原生 SRE / 运维开发工程师"
profile_exp_sre_desc: "主要做 GPU 和 AI 基础设施。用 Go + NVML API + Kubernetes Event 开发 GPU 故障诊断 Operator，自动识别 XID 错误、PCIe 链路异常，实现 Pod 驱逐与节点隔离。开发轻量级 GPU 监控 Agent，采集显存、温度、功耗、PCIe 带宽等细粒度指标，对接 Prometheus。跨云资源编排方面，用 Terraform 管理 AWS EKS 与火山引擎 VKE，把新环境交付周期从天级压缩到小时级。"
profile_exp_devops_title: "xxxx | 运维开发工程师（效能平台）"
profile_exp_devops_desc: "主导 200+ 传统业务从物理机/虚拟机向 Kubernetes 集群的平滑迁移，集群规模 300+ 节点，容器化率达到 90%，实现零故障迁移。搭建 Calico 网络隔离、LDAP + RBAC 权限体系、Jenkins + Harbor、GitLab + ArgoCD GitOps、EFK、Prometheus、SkyWalking 等平台能力。部署从天级缩短至小时级，版本回滚从 20 分钟降至 3 分钟以内，故障定位从小时级压缩到 10 分钟内。中间件通过 Terraform 管理 MySQL MGR、Redis、Kafka，并做性能调优，Kafka 吞吐提升至原来的 3 倍，跨节点通信延迟降低 40%。也落地过金融等保三级合规。"

profile_life_title: "兴趣与生活"
profile_life_p1: "做好当下的事情，不辜负自己。"
profile_life_p2: "不自视甚高，也不需要盲目自谦。所谓的权威和专业，也就那么回事。虽然我们看起来是芸芸众生相，但却是这芸芸众生相中独特的存在。"
profile_life_p3: "我们感觉到停滞，觉得无意义、无活力，是因为人除了安全感的需要外，还有着对于获得感和反馈感的需要。这两种动机都被满足时，人才会安住在一种满足中。"
profile_life_p4: "以我自己为例，23 年主要在注重自我成长，也调理好了睡眠问题，不再失眠。长期的主线任务是自我内核稳定。对于问题，注重交互、反馈和输出，是 n>n 的。不管是在老家还是现在的上海，都一样。"
profile_life_p5: "浅浅地理解到，成长是一件长期主义的事情。把眼光拉长到 3 年、5 年，以年为单位慢慢进步。别着急，一年内就想发生质的变化。聚焦和专注永远是最重要的，然后就是去具体行动落地。"
profile_life_p6: "低谷和困境会带着我们走向另外一个完全不知道的方向。"

