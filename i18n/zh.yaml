profile_bio_title: "个人介绍"
profile_bio_p1: "你好，我是升宏，一名专注于云原生基础设施与 AI Infra 方向的工程师。"
profile_bio_p2: "具备多年 Linux、Kubernetes 与云原生平台工程实践经验，主要使用 Go、Shell 等技术进行基础设施工具开发、自动化运维与平台能力建设。参与过大规模 Kubernetes 集群治理、DevOps 平台建设、GPU 资源管理及 AI 模型服务部署等工作。"
profile_bio_p3: "在工程实践中，我比较关注基础设施的稳定性、资源利用率与自动化能力，习惯从系统架构、运行机制和故障链路出发分析问题，并通过工具开发、流程优化和平台化建设解决实际问题。"
profile_bio_p4: "目前主要关注 AI Infrastructure、GPU 资源治理、云原生调度与推理服务可观测性，也在持续通过 Go 工程项目探索分布式系统设计与基础设施自动化诊断。"
profile_bio_p5: "希望持续深入基础设施工程领域，把复杂问题转化为稳定、可靠、可观测、可规模化的工程能力。"
ecosystem_title: "AI基础设施生态系统全景"
ecosystem_intro: "用四层结构看 AI 基础设施：GPU 与加速、推理/训练/治理、运行时、应用与智能体。每一层都关注资源边界、工程抽象和开发者参与路径。核心原则是：边界清晰、抽象统一、开发者友好、生态开放。"
