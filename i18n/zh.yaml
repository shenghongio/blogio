profile_exp_ai_delivery_desc: "负责 AI 平台私有化部署与技术支持，涉及 Qwen、LLaMA 等模型服务部署及 vLLM、TGI 推理框架，处理 GPU 资源配置、模型加载、Embedding / OCR 服务及推理调用异常，持续推进 AI 工作负载的稳定性与性能优化。"
profile_exp_sre_title: "云原生 SRE / 运维开发工程师"
profile_exp_sre_period: "2025"
profile_exp_sre_tags: "Cloud Native|Kubernetes|GPU"
profile_exp_sre_desc: "深入 Kubernetes 集群与 GPU 基础设施建设，基于 Go、NVML API 和 Kubernetes Event 开展 GPU 故障诊断与自动化治理，涉及 XID 错误、PCIe 异常、GPU 健康检查、Prometheus 监控及云原生资源调度，推动基础设施运维自动化与故障自愈。"
profile_exp_devops_title: "运维开发工程师（效能平台）"
profile_exp_devops_period: "2021 – 2024"
profile_exp_devops_tags: "DevOps|Platform Engineering"
profile_exp_devops_desc: "参与大规模 Kubernetes 集群及 DevOps 平台建设，涉及 300+ 节点集群管理、容器化迁移、Calico 网络、LDAP / RBAC 权限体系、Jenkins / GitLab / ArgoCD GitOps 交付，以及 Prometheus、EFK、SkyWalking 可观测性建设，具备中间件高可用与性能优化实践经验。"

profile_life_title: "兴趣与生活"
profile_life_p1: "做好当下的事情，不辜负自己。"
profile_life_p2: "不自视甚高，也不需要盲目自谦。所谓的权威和专业，也就那么回事。虽然我们看起来是芸芸众生相，但却是这芸芸众生相中独特的存在。"
profile_life_p3: "我们感觉到停滞，觉得无意义、无活力，是因为人除了安全感的需要外，还有着对于获得感和反馈感的需要。这两种动机都被满足时，人才会安住在一种满足中。"
profile_life_p4: "以我自己为例，23 年主要在注重自我成长，也调理好了睡眠问题，不再失眠。长期的主线任务是自我内核稳定。对于问题，注重交互、反馈和输出，是 n>n 的。不管是在老家还是现在的上海，都一样。"
profile_life_p5: "浅浅地理解到，成长是一件长期主义的事情。把眼光拉长到 3 年、5 年，以年为单位慢慢进步。别着急，一年内就想发生质的变化。聚焦和专注永远是最重要的，然后就是去具体行动落地。"
profile_life_p6: "低谷和困境会带着我们走向另外一个完全不知道的方向。"

