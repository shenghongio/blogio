profile_bio_title: "个人介绍"
profile_bio_p1: "你好，我是升宏，一名云原生 SRE / 运维开发工程师。"
profile_bio_p2: "拥有多年一线云原生 SRE 与运维开发经验，长期围绕 Kubernetes、云原生基础设施、自动化运维与平台工程开展工作。实践环境涵盖物理机、公有云、混合云，以及金融、互联网客户的私有化 AI 环境。"
profile_bio_p3: "熟悉 Kubernetes 大规模集群治理、Go 运维工具与 Operator 开发、GPU 算力治理、可观测性以及 CI/CD 与 GitOps，并参与过 300+ 节点 Kubernetes 集群、大规模业务容器化迁移和 AI 模型私有化部署等项目。"
profile_bio_p4: "目前主要关注云原生基础设施、GPU / AI 基础设施与运维工程化，希望把真实项目中的实践、问题排查和工程思考沉淀下来，记录技术，也记录解决问题的方法。"
ecosystem_title: "AI基础设施生态系统全景"
ecosystem_intro: "用四层结构看 AI 基础设施：GPU 与加速、推理/训练/治理、运行时、应用与智能体。每一层都关注资源边界、工程抽象和开发者参与路径。核心原则是：边界清晰、抽象统一、开发者友好、生态开放。"
