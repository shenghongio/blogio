profile_exp_ai_delivery_title: "AI Application Delivery Engineer"
profile_exp_ai_delivery_period: "2026"
profile_exp_ai_delivery_tags: "AI Infrastructure|GPU|LLM Serving"
profile_exp_ai_delivery_desc: "Responsible for private deployment and technical support of the AI platform, covering model services such as Qwen and LLaMA plus vLLM and TGI inference frameworks. Handled GPU resource configuration, model loading, Embedding / OCR services and inference call anomalies, continuously improving the stability and performance of AI workloads."
profile_exp_sre_title: "Cloud Native SRE / DevOps Engineer"
profile_exp_sre_period: "2025"
profile_exp_sre_tags: "Cloud Native|Kubernetes|GPU"
profile_exp_sre_desc: "Worked deeply on Kubernetes clusters and GPU infrastructure, building GPU fault diagnosis and automation with Go, NVML API and Kubernetes Events — covering XID errors, PCIe anomalies, GPU health checks, Prometheus monitoring and cloud native resource scheduling, driving infrastructure automation and self-healing."
profile_exp_devops_title: "DevOps Engineer (Efficiency Platform)"
profile_exp_devops_period: "2021 – 2024"
profile_exp_devops_tags: "DevOps|Platform Engineering"
profile_exp_devops_desc: "Contributed to large-scale Kubernetes cluster and DevOps platform builds, covering 300+ node cluster management, containerization migration, Calico networking, LDAP / RBAC access control, Jenkins / GitLab / ArgoCD GitOps delivery, and observability with Prometheus, EFK and SkyWalking, with hands-on experience in middleware high availability and performance tuning."

profile_life_title: "Life & Hobbies"
profile_life_p1: "Live the present, don't let yourself down."
profile_life_p2: "Neither overestimate yourself nor blindly humble yourself. Authority and expertise are what they are. We are unique among the many, even if we look alike."
profile_life_p3: "We feel stagnant, meaningless, lifeless because beyond safety, humans need a sense of achievement and feedback. When both motivations are satisfied, one settles into contentment."
profile_life_p4: "Personally, 2023 was mainly about self-growth. I fixed my sleep problems and no longer suffer from insomnia. My long-term main quest is stabilizing my inner core. Regarding problems, I value interaction, feedback, and output — n>n. Whether back home or in Shanghai now, it's the same."
profile_life_p5: "I've come to understand, gradually, that growth is a long-term game. Extend the horizon to 3 or 5 years, progress slowly by the year. Don't rush — you can't expect qualitative change within 12 months. Focus and dedication matter most, then take concrete action."
profile_life_p6: "Troughs and struggles carry us toward completely unknown directions."

