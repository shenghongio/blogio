profile_exp_title: "Experience"
profile_exp_ai_delivery_title: "xxxx | AI Application Delivery Engineer"
profile_exp_ai_delivery_desc: "Deployment and technical support for AI applications in private environments. Designed and delivered deployment solutions across bare-metal, virtual machines, and public clouds. Responsible for AI agent product deployments including service components, model services, and dependency configuration. Deployed open-source model services such as Qwen and LLaMA, optimized inference environments with vLLM/TGI. Adjusted model inference parameters (batching, caching, parallel deployment, etc.) based on business needs. Deployed Embedding, OCR and other AI foundation services, assisted with application integration. Resolved issues in GPU resource configuration, model loading failures, and service call timeouts."
profile_exp_sre_title: "xxxx | Cloud Native SRE / DevOps Engineer"
profile_exp_sre_desc: "Focused on GPU and AI infrastructure. Built a GPU fault-diagnosis Operator with Go + NVML API + Kubernetes Events — automatically identifying XID errors and PCIe link anomalies to trigger Pod eviction and node isolation. Developed a lightweight GPU monitoring Agent collecting fine-grained metrics (VRAM, temperature, power, PCIe bandwidth) integrated with Prometheus. In cross-cloud resource orchestration, managed AWS EKS and Volcengine VKE with Terraform, compressing new environment delivery from days to hours."
profile_exp_devops_title: "xxxx | DevOps Engineer (Efficiency Platform)"
profile_exp_devops_desc: "Led smooth migration of 200+ legacy workloads from bare-metal/VM to Kubernetes clusters at 300+ nodes with 90% containerization rate and zero incidents. Built Calico network isolation, LDAP + RBAC, Jenkins + Harbor, GitLab + ArgoCD GitOps, EFK, Prometheus, SkyWalking and other platform capabilities. Deployment time reduced from days to hours, rollback from 20 min to under 3 min, incident triage from hours to within 10 min. Managed MySQL MGR, Redis, Kafka via Terraform with performance tuning — Kafka throughput tripled, cross-node latency reduced by 40%. Also delivered financial-grade level-3 compliance."

profile_life_title: "Life & Hobbies"
profile_life_p1: "Live the present, don't let yourself down."
profile_life_p2: "Neither overestimate yourself nor blindly humble yourself. Authority and expertise are what they are. We are unique among the many, even if we look alike."
profile_life_p3: "We feel stagnant, meaningless, lifeless because beyond safety, humans need a sense of achievement and feedback. When both motivations are satisfied, one settles into contentment."
profile_life_p4: "Personally, 2023 was mainly about self-growth. I fixed my sleep problems and no longer suffer from insomnia. My long-term main quest is stabilizing my inner core. Regarding problems, I value interaction, feedback, and output — n>n. Whether back home or in Shanghai now, it's the same."
profile_life_p5: "I've come to understand, gradually, that growth is a long-term game. Extend the horizon to 3 or 5 years, progress slowly by the year. Don't rush — you can't expect qualitative change within 12 months. Focus and dedication matter most, then take concrete action."
profile_life_p6: "Troughs and struggles carry us toward completely unknown directions."

profile_research_title: "Research & Practice Focus"
profile_research_lead: "Long-term focus areas:"
profile_research_tag1_title: "AI Native Infrastructure"
profile_research_tag1_desc: "Re-examining infrastructure design assumptions in resource modeling, scheduling, and governance — starting from the non-deterministic nature of AI workloads."
profile_research_tag2_title: "Compute Governance & GPU Virtualization"
profile_research_tag2_desc: "Improving resource utilization in heterogeneous hardware environments, studying GPU sharing, isolation, scheduling, and governance mechanisms."
profile_research_tag3_title: "Cloud Native Architecture Evolution"
profile_research_tag3_desc: "Watching Kubernetes capability boundaries under AI workloads, and the evolution of platform engineering and system governance."
profile_research_tag4_title: "Open Source Ecosystem & Standardization"
profile_research_tag4_desc: "Pushing engineering-verifiable and design-evolvable open-source collaboration, fostering deep connections between China and global communities."
profile_research_close: "These directions all converge on one core question: how to evolve compute from a 'scarce hardware resource' into a governable, schedulable, scalable infrastructure capability."

