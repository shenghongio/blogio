profile_bio_title: "About Me"
profile_bio_p1: "Hi, I'm Sheng Hong, a Cloud Native SRE / DevOps Engineer."
profile_bio_p2: "Years of hands-on experience in cloud native SRE and platform engineering. Working across Kubernetes, cloud native infrastructure, automation and platform engineering. Practice environments span bare-metal, public cloud, hybrid cloud, and private AI deployments for finance and internet clients."
profile_bio_p3: "Familiar with large-scale Kubernetes cluster governance, Go operations tools and Operator development, GPU compute governance, observability, CI/CD and GitOps. Involved in 300+ node Kubernetes clusters, large-scale containerization migrations and private AI model deployments."
profile_bio_p4: "Currently focused on cloud native infrastructure, GPU / AI infrastructure and operations engineering. Documenting real-world practices, troubleshooting and engineering thinking — recording techniques and the methods of problem solving."
ecosystem_title: "Panorama of AI infrastructure ecosystem"
ecosystem_intro: "A four-layer view of AI infrastructure: GPU and acceleration, inference/training/governance, runtime, and applications/agents. Each layer is examined through resource boundaries, engineering abstractions, and developer participation. The core principles: clear boundaries, unified abstractions, developer-friendly, open ecosystem."
