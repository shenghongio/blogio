focus_title: "Experience Areas & Directions"
focus_description: "Exploring AI systems engineering from infrastructure to low-level runtimes."
focus_intro: "My work is not just about introducing technology, but about refining judgment, expression, and collaboration around the key parts of the infrastructure software ecosystem. Specifically, I focus on resource abstraction and scheduling in GPU and AI infrastructure, the evolution and governance of cloud-native systems, and collaboration and developer experience in open-source communities. In these areas, I try to understand technology trends and engineering trade-offs, explain complex systems clearly, and work with the team and community to drive solutions forward. Because technology only becomes a real part of the ecosystem when it is understood and participated in."
