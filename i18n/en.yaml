focus_ai_desc: "GPU scheduling, inference systems, agent runtimes, resource abstraction, and platform engineering — understanding what AI workloads demand from the infrastructure layer."
focus_cloud_title: "Cloud Native System Evolution"
focus_cloud_desc: "From Kubernetes and service mesh to platform engineering, observing how cloud-native capabilities extend into AI-era resource governance, elasticity, and multi-tenancy."
focus_os_title: "Open Source Ecosystem & DX"
focus_os_desc: "Documentation, tutorials, contribution paths, community communication, and developer events — turning complex infrastructure from a code repository into a comprehensible, participatory ecosystem."
