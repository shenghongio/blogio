name: Hugo Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hugo-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Sync project activity order
        continue-on-error: true
        run: python3 scripts/sync_projects.py

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Verify Hugo modules
        run: hugo mod verify

      - name: Build site
        run: hugo --gc --minify --printPathWarnings

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: public/

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          BASE="${{ steps.deployment.outputs.page_url }}"
          echo "=========================================="
          echo "  En Site URL:    ${BASE}"
          echo "  Zh Site URL:    ${BASE}zh/"
          echo "  Deployment URL: ${{ steps.deployment.outputs.deployment_url }}"
          echo "  Repo:           ${{ github.repository }}"
          echo "  Commit:         ${{ github.sha }}"
          echo "=========================================="