baseURL = 'https://shenghongio.github.io/blogio/'
defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false
title = 'Real ShengHong | AI Native Infrastructure Engineer'

enableRobotsTXT = true
enableGitInfo = true
hasCJKLanguage = true

[params]
  author = "ShengHong"

[languages]
  [languages.zh]
    label = "中文"
    locale = "zh-cn"
    weight = 1

    [languages.zh.menu]
      [[languages.zh.menu.main]]
        name = "首页"
        url = "/"
        weight = 10
        [languages.zh.menu.main.params]
          icon = "home"

      [[languages.zh.menu.main]]
        name = "技术栈"
        weight = 20
        [languages.zh.menu.main.params]
          icon = "book"

      [[languages.zh.menu.main]]
        name = "关于"
        url = "/profile/"
        weight = 50
        [languages.zh.menu.main.params]
          icon = "user"

disableKinds = ["taxonomy", "term", "RSS"]

[taxonomies]

[pagination]
  pagerSize = 10

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"