baseURL = 'https://shenghongio.github.io/blogio/'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = 'Real ShengHong | AI Native Infrastructure Engineer'

enableRobotsTXT = true
enableGitInfo = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 10
        [languages.en.menu.main.params]
          icon = "home"

      [[languages.en.menu.main]]
        name = "Stack"
        weight = 20
        [languages.en.menu.main.params]
          icon = "book"

      [[languages.en.menu.main]]
        name = "About"
        url = "/profile/"
        weight = 50
        [languages.en.menu.main.params]
          icon = "user"

  [languages.zh]
    label = "中文"
    locale = "zh-cn"
    weight = 2

    [languages.zh.menu]
      [[languages.zh.menu.main]]
        name = "首页"
        url = "/"
        weight = 10
        [languages.zh.menu.main.params]
          icon = "home"

      [[languages.zh.menu.main]]
        name = "技术栈"
        weight = 20
        [languages.zh.menu.main.params]
          icon = "book"

      [[languages.zh.menu.main]]
        name = "关于"
        url = "/profile/"
        weight = 50
        [languages.zh.menu.main.params]
          icon = "user"

disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"