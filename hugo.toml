baseURL = 'https://shenghongio.github.io/blogio/'
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
title = 'Real ShengHong | AI Native Infrastructure Engineer'

enableRobotsTXT = true
enableGitInfo = true

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1

    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/"
        weight = 10
        [languages.en.menu.main.params]
          icon = "home"

      [[languages.en.menu.main]]
        name = "Stack"
        url = "/stack/"
        weight = 20
        [languages.en.menu.main.params]
          icon = "book"

      [[languages.en.menu.main]]
        name = "Blog"
        url = "/posts/"
        weight = 22
        [languages.en.menu.main.params]
          icon = "search"

      [[languages.en.menu.main]]
        name = "Projects"
        url = "/projects/"
        weight = 30
        [languages.en.menu.main.params]
          icon = "project"

      [[languages.en.menu.main]]
        name = "SRE"
        url = "/directions/"
        weight = 40
        [languages.en.menu.main.params]
          icon = "compass"

      [[languages.en.menu.main]]
        name = "About"
        url = "/profile/"
        weight = 50
        [languages.en.menu.main.params]
          icon = "user"

  [languages.zh]
    label = "中文"
    locale = "zh-cn"
    weight = 2

    [languages.zh.menu]
      [[languages.zh.menu.main]]
        name = "首页"
        url = "/"
        weight = 10
        [languages.zh.menu.main.params]
          icon = "home"

      [[languages.zh.menu.main]]
        name = "Stack"
        url = "/stack/"
        weight = 20
        [languages.zh.menu.main.params]
          icon = "book"

      [[languages.zh.menu.main]]
        name = "博客"
        url = "/posts/"
        weight = 22
        [languages.zh.menu.main.params]
          icon = "search"

      [[languages.zh.menu.main]]
        name = "项目"
        url = "/projects/"
        weight = 30
        [languages.zh.menu.main.params]
          icon = "project"

      [[languages.zh.menu.main]]
        name = "SRE"
        url = "/directions/"
        weight = 40
        [languages.zh.menu.main.params]
          icon = "compass"

      [[languages.zh.menu.main]]
        name = "关于"
        url = "/profile/"
        weight = 50
        [languages.zh.menu.main.params]
          icon = "user"

[pagination]
  pagerSize = 10

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    lineNumbersInTable = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"