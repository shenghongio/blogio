{{ define "main" }}

<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
  </header>

  <div class="post-content">
    {{ .Content }}
    <section class="stack-columns">
      {{ partial "stack-columns.html" . }}
    </section>
  </div>
</article>

{{ end }}
