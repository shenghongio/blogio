{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "breadcrumb.html" (dict "label" (i18n "breadcrumb_sre") "currentAria" false) }}
  </header>

  <div class="post-content">
    {{ .Content }}
    <ul class="directions-list">
      {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">
          <span class="directions-list-title">{{ .Title }}</span>
          {{ with .Date }}<time class="directions-list-date">{{ .Format "2006-01-02" }}</time>{{ end }}
        </a>
      </li>
      {{ end }}
    </ul>
  </div>
</article>
{{ end }}
