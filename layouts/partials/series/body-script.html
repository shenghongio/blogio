<script>
(function(){
    var P = '{{ .prefix }}';
    var enablePartSwitch = {{ if .enablePartSwitch }}true{{ else }}false{{ end }};
    var viewer = document.getElementById(P + '-article-viewer');
    if (!viewer) return;
    var templates = document.getElementById(P + '-part-templates');
    var templateHost = null;
    if (templates) {
        templateHost = document.createElement('div');
        templateHost.innerHTML = templates.textContent;
    }
    var cache = {};
    var currentIdx = 0;

    var syncPanes = function(idx){
        document.querySelectorAll('[data-part-pane]').forEach(function(pane){
            pane.classList.toggle(P + '-nav-pane--hidden', pane.getAttribute('data-part-pane') !== String(idx));
        });
        if (enablePartSwitch) closeDropdowns();
    };

    var closeDropdowns = function(){
        document.querySelectorAll('.' + P + '-sidebar-part-dropdown').forEach(function(dd){
            dd.classList.remove(P + '-sidebar-part-dropdown--open');
            var trigger = dd.querySelector('[data-part-dropdown-trigger]');
            if (trigger) trigger.setAttribute('aria-expanded', 'false');
        });
    };

    var activeLink = function(){
        return document.querySelector('.' + P + '-article--active .' + P + '-article-link');
    };

    var markActive = function(link){
        document.querySelectorAll('.' + P + '-article--active').forEach(function(li){
            li.classList.remove(P + '-article--active');
            var m = li.querySelector('.' + P + '-article-mark');
            if (m) m.remove();
        });
        var li = link.closest('.' + P + '-article');
        if (!li) return;
        li.classList.add(P + '-article--active');
        if (!li.querySelector('.' + P + '-article-mark')) {
            var mark = document.createElement('span');
            mark.className = P + '-article-mark';
            li.insertBefore(mark, li.firstChild);
        }
    };

    var renderTitle = function(title, dateStr, sustain){
        var h = document.createElement('h2');
        h.className = P + '-overview-title';
        h.textContent = title || '';
        var meta = document.createElement('div');
        meta.className = P + '-overview-meta';
        if (dateStr) {
            var dt = document.createElement('span');
            dt.className = P + '-date-tag';
            dt.textContent = '最后更新：' + dateStr;
            meta.appendChild(dt);
        }
        if (sustain !== null) {
            var badge = document.createElement('span');
            badge.className = P + '-badge';
            badge.textContent = '持续维护：' + (sustain ? '是' : '否');
            meta.appendChild(badge);
        }
        return [h, meta];
    };

    var extractArticle = function(doc){
        var content = doc.querySelector('.post-content');
        var header = doc.querySelector('.post-header');
        var titleEl = header ? header.querySelector('.post-title') : null;
        var dateEl = header ? header.querySelector('.post-meta') : null;
        var sustain = null;
        if (!content && doc.getElementById(P + '-article-viewer')) {
            var singleViewer = doc.getElementById(P + '-article-viewer');
            content = singleViewer.querySelector('.' + P + '-overview-body');
            titleEl = singleViewer.querySelector('.' + P + '-overview-title');
            dateEl = singleViewer.querySelector('.' + P + '-overview-meta');
            var badge = singleViewer.querySelector('.' + P + '-badge');
            if (badge) sustain = badge.textContent.indexOf('是') !== -1;
        }
        var dateStr = '';
        if (dateEl) {
            var raw = dateEl.textContent;
            var m = raw.match(/\d{4}-\d{2}-\d{2}/);
            if (m) {
                dateStr = m[0];
            } else {
                var cn = raw.match(/(\d{4})年(\d{1,2})月(\d{1,2})/);
                if (cn) {
                    dateStr = cn[1] + '-' + ('0' + cn[2]).slice(-2) + '-' + ('0' + cn[3]).slice(-2);
                }
            }
        }
        if (sustain === null && header) {
            var sustainEl = header.querySelector('[data-sustain]');
            if (sustainEl) sustain = sustainEl.getAttribute('data-sustain') === 'true';
        }
        return {
            title: titleEl ? titleEl.textContent.trim() : '',
            date: dateStr,
            sustain: sustain,
            html: content ? content.innerHTML : ''
        };
    };

    var renderArticle = function(title, contentHtml, dateStr, sustain){
        viewer.innerHTML = '';
        var nodes = renderTitle(title, dateStr, sustain);
        viewer.appendChild(nodes[0]);
        viewer.appendChild(nodes[1]);
        var body = document.createElement('div');
        body.className = P + '-markdown ' + P + '-overview-body';
        body.innerHTML = contentHtml;
        viewer.appendChild(body);
        buildToc(true);
        window.scrollTo({ top: 0, behavior: 'auto' });
    };

    var loadArticle = function(url, link){
        var finish = function(data){
            renderArticle(data.title, data.html, data.date, data.sustain);
            markActive(link);
        };
        if (cache[url]) { finish(cache[url]); return; }
        viewer.innerHTML = '<div class="' + P + '-article-loading">加载中...</div>';
        fetch(url)
            .then(function(r){ return r.text(); })
            .then(function(html){
                var doc = new DOMParser().parseFromString(html, 'text/html');
                var data = extractArticle(doc);
                if (!data.html) {
                    viewer.innerHTML = '<div class="' + P + '-article-loading">无法加载文章</div>';
                    return;
                }
                cache[url] = data;
                finish(data);
            })
            .catch(function(){
                viewer.innerHTML = '<div class="' + P + '-article-loading">加载失败</div>';
            });
    };

    var clearActive = function(){
        document.querySelectorAll('.' + P + '-article--active').forEach(function(li){
            li.classList.remove(P + '-article--active');
            var m = li.querySelector('.' + P + '-article-mark');
            if (m) m.remove();
        });
    };

    var tocEl = document.getElementById(P + '-toc');
    var tocInner = tocEl ? tocEl.querySelector('.' + P + '-toc-inner') : null;

    var headText = function(h){
        var c = h.cloneNode(true);
        c.querySelectorAll('.anchor').forEach(function(a){ a.remove(); });
        return c.textContent.trim();
    };

    var tocSpy = function(){
        if (!tocInner) return;
        var heads = viewer.querySelectorAll('h2, h3');
        var cur = null;
        heads.forEach(function(h){
            if (h.classList.contains(P + '-overview-title')) return;
            if (h.getBoundingClientRect().top <= 100) cur = h.id;
        });
        tocInner.querySelectorAll('a').forEach(function(a){
            var target = a.getAttribute('data-target');
            a.parentElement.classList.toggle(P + '-toc-active', !!cur && target === cur);
        });
    };

    var setTocVisible = function(show){
        if (!tocEl) return;
        tocEl.hidden = !show;
        if (!show) tocInner.innerHTML = '';
    };

    var TOC_MIN_WIDTH = 150;
    var TOC_PAD_X = 20;
    var TOC_INDENT = {};
    TOC_INDENT[P + '-toc-h2'] = 12;
    TOC_INDENT[P + '-toc-h3'] = 28;

    var textWidth = function(text, weight){
        var probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-size:13px;line-height:1.6;font-family:inherit;font-weight:' + (weight || 600);
        probe.textContent = text;
        document.body.appendChild(probe);
        var w = probe.offsetWidth;
        probe.parentNode.removeChild(probe);
        return w;
    };

    var syncTocWidth = function(){
        if (!tocEl || tocEl.hidden || !tocInner) return;
        var widest = 0;
        tocInner.querySelectorAll('.' + P + '-toc-title, .' + P + '-toc-list a').forEach(function(el){
            var indent = 0;
            var weight = 600;
            if (el.tagName === 'A') {
                indent = TOC_INDENT[el.parentElement.className] || 0;
                weight = el.parentElement.className === P + '-toc-h3' ? 400 : 600;
            }
            widest = Math.max(widest, Math.ceil(textWidth(el.textContent, weight)) + indent);
        });
        if (!widest) return;
        var width = widest + TOC_PAD_X * 2 + 2;
        width = Math.max(TOC_MIN_WIDTH, width);
        var limit = Math.max(TOC_MIN_WIDTH, Math.round(window.innerWidth * 0.3));
        if (width > limit) width = limit;
        document.documentElement.style.setProperty('--' + P + '-toc-width', width + 'px');
    };

    var buildToc = function(showToc){
        if (!tocEl || !tocInner) return;
        if (!showToc) {
            setTocVisible(false);
            return;
        }
        var heads = viewer.querySelectorAll('h2, h3');
        var items = [];
        heads.forEach(function(h, i){
            if (h.classList.contains(P + '-overview-title')) return;
            if (!h.id) h.id = P + '-sec-' + i;
            items.push({ id: h.id, text: headText(h), level: h.tagName.toLowerCase() });
        });
        if (!items.length) {
            setTocVisible(false);
            return;
        }
        setTocVisible(true);
        var ul = document.createElement('ul');
        ul.className = P + '-toc-list';
        var title = document.createElement('div');
        title.className = P + '-toc-title';
        title.textContent = '本章目录';
        tocInner.innerHTML = '';
        tocInner.appendChild(title);
        items.forEach(function(it){
            var li = document.createElement('li');
            li.className = P + '-toc-' + it.level;
            var a = document.createElement('a');
            a.href = '#' + it.id;
            a.setAttribute('data-target', it.id);
            a.textContent = it.text;
            a.addEventListener('click', function(e){
                e.preventDefault();
                var t = document.getElementById(it.id);
                if (t) window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' });
            });
            li.appendChild(a);
            ul.appendChild(li);
        });
        tocInner.appendChild(ul);
        syncTocWidth();
        tocSpy();
    };

    var showOverview = function(idx){
        currentIdx = parseInt(idx) || 0;
        if (!templateHost) return;
        var tmpl = templateHost.querySelector('[data-overview="' + currentIdx + '"]');
        if (!tmpl) return;
        viewer.innerHTML = tmpl.innerHTML;
        clearActive();
        syncPanes(currentIdx);
        buildToc(true);
        if (enablePartSwitch) {
            var hash = currentIdx > 0 ? '#part-' + currentIdx : '';
            if (location.hash !== hash) {
                if (history.replaceState) history.replaceState(null, '', location.pathname + location.search + hash);
            }
        }
        window.scrollTo({ top: 0, behavior: 'auto' });
    };

    var saveState = function(extra){
        var st = {};
        st[P + 'Overview'] = currentIdx;
        if (extra) {
            for (var k in extra) st[k] = extra[k];
        }
        return st;
    };

    window.addEventListener('scroll', tocSpy, { passive: true });
    window.addEventListener('resize', syncTocWidth, { passive: true });

    if (enablePartSwitch) {
        document.addEventListener('click', function(e){
            var trigger = e.target.closest('[data-part-dropdown-trigger]');
            if (trigger) {
                e.preventDefault();
                e.stopPropagation();
                var dd = trigger.closest('.' + P + '-sidebar-part-dropdown');
                if (!dd) return;
                var isOpen = dd.classList.contains(P + '-sidebar-part-dropdown--open');
                closeDropdowns();
                if (!isOpen) {
                    dd.classList.add(P + '-sidebar-part-dropdown--open');
                    trigger.setAttribute('aria-expanded', 'true');
                    var menu = dd.querySelector('.' + P + '-sidebar-part-menu');
                    if (menu) {
                        var rect = trigger.getBoundingClientRect();
                        var mw = menu.offsetWidth;
                        var left = rect.left;
                        if (left + mw > window.innerWidth - 8) left = window.innerWidth - 8 - mw;
                        if (left < 8) left = 8;
                        menu.style.left = left + 'px';
                        menu.style.top = (rect.bottom + 4) + 'px';
                    }
                }
                return;
            }
            var item = e.target.closest('[data-part-index]');
            if (item) {
                e.preventDefault();
                e.stopPropagation();
                showOverview(item.getAttribute('data-part-index'));
                return;
            }
            if (!e.target.closest('.' + P + '-sidebar-part-dropdown')) {
                closeDropdowns();
            }
        });

        window.addEventListener('resize', closeDropdowns, { passive: true });
    }

    document.querySelectorAll('[data-section-head]').forEach(function(head){
        if (head.getAttribute('data-section-bound') === '1') return;
        head.setAttribute('data-section-bound', '1');
        head.addEventListener('click', function(){
            var section = head.closest('.' + P + '-section');
            if (section) section.classList.toggle(P + '-section--open');
        });
    });

    history.replaceState(saveState(), '', location.href);

    document.addEventListener('click', function(e){
        var link = e.target.closest('.' + P + '-article-link');
        if (!link) return;
        if (link.closest('.' + P + '-article--draft')) return;
        var url = link.getAttribute('data-article');
        if (!url) return;
        if (viewer.hasAttribute('data-single')) return;
        e.preventDefault();
        e.stopPropagation();
        if (history.pushState) history.pushState(saveState({ article: url }), '', location.href);
        loadArticle(url, link);
    }, true);

    window.addEventListener('popstate', function(e){
        var st = e.state || {};
        var articleKey = P + 'Article';
        var overviewKey = P + 'Overview';
        if (st[articleKey]) {
            var link = document.querySelector('.' + P + '-article-link[data-article="' + st[articleKey] + '"]');
            if (link) {
                loadArticle(st[articleKey], link);
                return;
            }
        }
        showOverview(st[overviewKey] || 0);
    });

    var current = activeLink();
    if (current && current.getAttribute('data-article')) {
        markActive(current);
        var activePane = current.closest('[data-part-pane]');
        if (activePane) {
            currentIdx = parseInt(activePane.getAttribute('data-part-pane')) || 0;
            syncPanes(currentIdx);
            history.replaceState(saveState(), '', location.href);
        }
        return;
    }

    var initialIdx = 0;
    if (enablePartSwitch) {
        var hashMatch = location.hash.match(/^#part-(\d+)$/);
        if (hashMatch) initialIdx = parseInt(hashMatch[1], 10) || 0;
        showOverview(initialIdx);
    } else {
        syncPanes(currentIdx);
    }
})();
</script>
