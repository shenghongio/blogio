{{ $customCSS := resources.Get "css/custom.css" }}

<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}">

{{ if $customCSS }}
{{ $customCSS = $customCSS | minify | fingerprint }}
<link rel="stylesheet" href="{{ $customCSS.RelPermalink }}" integrity="{{ $customCSS.Data.Integrity }}">
{{ end }}
<script>
document.addEventListener('DOMContentLoaded', function() {
  var viewer = document.querySelector('[id$="-article-viewer"]');
  if (!viewer) return;

  var prefix = viewer.id.replace('-article-viewer', '');

  document.querySelectorAll('[data-section-head]').forEach(function(head) {
    if (head.getAttribute('data-section-bound') === '1') return;
    head.setAttribute('data-section-bound', '1');
    head.addEventListener('click', function() {
      var section = head.parentElement;
      if (!section) return;
      if (!section.classList.contains(prefix + '-section')) return;
      section.classList.toggle(prefix + '-section--open');
    });
  });
});</script>
